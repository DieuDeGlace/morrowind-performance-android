name: Android Performance Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib g++-multilib autoconf automake libtool gettext cmake pkg-config patch unzip zip p7zip-full python3 curl wget
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.1.10909125'
      - uses: actions/cache@v4
        with:
          path: |
            source/buildscripts/downloads
            source/buildscripts/toolchain
            source/buildscripts/prefix
            source/buildscripts/build
          key: android-arm64-native-v1-${{ hashFiles('source/buildscripts/CMakeLists.txt', 'source/buildscripts/include/**') }}
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: android-gradle-v1-${{ hashFiles('source/**/*.gradle', 'source/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Prepare release signing key
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/openmw-performance.p12"
      - name: Build, verify, and sign ARM64 Release APK
        working-directory: source
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ runner.temp }}/openmw-performance.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: openmw-performance
        run: bash tools/build-performance-release.sh 4
      - uses: actions/upload-artifact@v4
        with:
          name: OpenMW-performance-Android-arm64
          path: release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-build-diagnostics
          path: |
            source/buildscripts/performance-native-build.log
            source/app/build/reports/tests
            source/app/build/outputs/logs
