name: Android Performance Release

on:
  workflow_dispatch:
    inputs:
      dependencies_only:
        description: Prepare and cache native dependencies without building an APK
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  arm64:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Test native engine cache freshness
        run: python3 -B source/tools/test-engine-cache.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib g++-multilib autoconf automake libtool gettext cmake pkg-config patch unzip zip p7zip-full python3 curl wget
      - name: Install APK SDK packages
        if: ${{ !inputs.dependencies_only }}
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.1.10909125'
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            source/buildscripts/downloads
            source/buildscripts/toolchain
            source/buildscripts/prefix
            source/buildscripts/build
          restore-keys: |
            android-arm64-native-v2-${{ hashFiles('source/buildscripts/CMakeLists.txt', 'source/buildscripts/build.sh', 'source/buildscripts/include/**') }}-${{ inputs.dependencies_only && 'deps' || 'engine' }}-
            android-arm64-native-v2-${{ hashFiles('source/buildscripts/CMakeLists.txt', 'source/buildscripts/build.sh', 'source/buildscripts/include/**') }}-
            android-arm64-native-v2-
            android-arm64-native-v1-
          key: android-arm64-native-v2-${{ hashFiles('source/buildscripts/CMakeLists.txt', 'source/buildscripts/build.sh', 'source/buildscripts/include/**') }}-${{ inputs.dependencies_only && 'deps' || 'engine' }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: android-gradle-v1-${{ hashFiles('source/**/*.gradle', 'source/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Cache verified Boost release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cmake_file=source/buildscripts/CMakeLists.txt
          boost_version=$(sed -n 's/^set(BOOST_VERSION \(.*\))$/\1/p' "$cmake_file" | tr -d '\r')
          boost_sha256=$(sed -n 's/^set(BOOST_HASH SHA256=\(.*\))$/\1/p' "$cmake_file" | tr -d '\r')
          [[ "$boost_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$boost_sha256" =~ ^[0-9a-f]{64}$ ]]
          archive_name="boost-${boost_version}.tar.gz"
          archive_path="source/buildscripts/downloads/$archive_name"
          mkdir -p source/buildscripts/downloads
          if ! printf '%s  %s\n' "$boost_sha256" "$archive_path" | sha256sum --check --status; then
            gh release download "boost-${boost_version}" --repo boostorg/boost \
              --pattern "$archive_name" --output "$archive_path" --clobber
          fi
          printf '%s  %s\n' "$boost_sha256" "$archive_path" | sha256sum --check
      - name: Prepare native dependencies
        if: ${{ inputs.dependencies_only }}
        working-directory: source/buildscripts
        run: |
          chmod +x build.sh include/*.sh
          ./build.sh --arch arm64 --release --lto --jobs 4 --deps-only 2>&1 | tee performance-native-build.log
      - name: Provide linker memory headroom
        if: ${{ !inputs.dependencies_only }}
        run: |
          free -h
          df -h /mnt
          available_mb=$(df -Pm /mnt | awk 'NR == 2 {print $4}')
          if (( available_mb > 12288 )); then
            sudo fallocate -l 8G /mnt/openmw-performance.swap
            sudo chmod 600 /mnt/openmw-performance.swap
            sudo mkswap /mnt/openmw-performance.swap
            sudo swapon /mnt/openmw-performance.swap
          fi
      - name: Build and verify ARM64 Release APK
        if: ${{ !inputs.dependencies_only }}
        working-directory: source
        run: |
          (while sleep 60; do
            echo "Native build memory at $(date -u +%T)"
            free -h
            ps -C ld.lld -o pid,rss,etime,comm || true
          done) &
          memory_monitor=$!
          trap 'kill "$memory_monitor" 2>/dev/null || true' EXIT
          bash tools/build-performance-release.sh 4 build
      - name: Prepare release signing key
        if: ${{ !inputs.dependencies_only }}
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/openmw-performance.p12"
      - name: Sign and verify ARM64 Release APK
        if: ${{ !inputs.dependencies_only }}
        working-directory: source
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ runner.temp }}/openmw-performance.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: openmw-performance
        run: bash tools/build-performance-release.sh 4 sign
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.dependencies_only }}
        with:
          name: OpenMW-Ragdoll-Preview-Android-arm64
          path: release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-build-diagnostics
          path: |
            source/buildscripts/performance-native-build.log
            source/app/build/reports/tests
            source/app/build/outputs/logs
      - uses: actions/cache/save@v4
        if: always() && steps.native-cache.outputs.cache-primary-key != '' && steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            source/buildscripts/downloads
            source/buildscripts/toolchain
            source/buildscripts/prefix
            source/buildscripts/build
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
